# The seven weekly class types — what each one is, who teaches it, and when it meets.
# Single source of truth for every class name, description, instructor and time on the
# site. Descriptions are owner-supplied copy; use them verbatim.
#
# Schema:
#   - name:         class name exactly as it appears in the signup tiers (required)
#     instructor:   full name, matching the <h3> on about.html (required)
#     anchor:       that instructor's id on about.html, for deep links (required)
#     day:          weekday it meets (required)
#     startEt:      24-hour start time, Eastern (required). Pacific is derived at build
#                   time as ET minus 3, which holds year-round since both zones shift
#                   together for DST.
#     levels:       which tiers include it: 1, 2, or both (required). signup.html's tier
#                   cards are generated from this, so it is the ONLY place tier
#                   composition is written down.
#     description:  one sentence, `>` folded scalar (required)
#
# A class is the key, not the instructor: one instructor may teach several classes, so
# the same name may appear on more than one entry. Tier membership lives in signup.html.

- name: Main Lecture
  instructor: Kevin Bao
  anchor: kevinbao
  day: Saturday
  startEt: "19:00"
  levels: [1, 2]
  description: >
    Lecture-based class covering the central curriculum.

